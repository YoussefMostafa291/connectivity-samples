name: Build WifiRttScan APK

on:
  push:
    branches:
      - feature/rtt-coordinate-csv
    paths:
      - 'WifiRttScan/**'
      - '.github/workflows/build-wifirttscan-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 28 components
        run: sdkmanager "platforms;android-28" "build-tools;28.0.3"

      - name: Build debug APK
        working-directory: WifiRttScan
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WifiRttScan-debug-apk
          path: WifiRttScan/Application/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
